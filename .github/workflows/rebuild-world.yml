name: Rebuild world (x86_64, one-shot)
# Builds all packages for x86_64 using the Debian builder.
# No kominka:core bootstrap needed — Debian is the native build environment.
# Outputs: GitHub artifacts named <pkg>-amd64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg:
          # Missing x86_64 builds
          - boringssl
          - curl
          - git
          - go
          - linux-pam
          - muon
          - sudo-rs
          - tmux
          - zlib
          # Rebuild with strip enabled
          - cargo
          - zig
          - tailscale

    steps:
      - uses: actions/checkout@v4

      - name: Build Debian builder image
        run: |
          docker build \
            --build-context packages=packages \
            -t kominka-debian-builder -f Dockerfile.glibc .

      - name: Build ${{ matrix.pkg }}
        run: |
          mkdir -p out
          docker run --rm \
            -v "$PWD/packages:/packages:ro" \
            -v "$PWD/pm.ysh:/usr/bin/pm:ro" \
            -v "$PWD/out:/out" \
            -e KOMINKA_PATH=/packages \
            -e KOMINKA_ROOT=/kominka-root \
            -e KOMINKA_COMPRESS=gz \
            -e KOMINKA_COLOR=0 \
            -e KOMINKA_PROMPT=0 \
            -e KOMINKA_FORCE=1 \
            -e KOMINKA_GET=/usr/bin/curl \
            -e KOMINKA_INSECURE=1 \
            -e LOGNAME=root \
            -e HOME=/root \
            kominka-debian-builder sh -c '
              db=/kominka-root/var/db/kominka/installed
              # Register tools that Debian provides so pm doesn't try to build them.
              # glibc: Debian's 2.36 is ABI-compatible with Kominka's 2.43 targets.
              # go/cargo: Debian ships these; building them from source would add hours.
              # Kominka packages (zig, zlib, boringssl, curl) must still be built by
              # pm so their outputs land in KOMINKA_ROOT for dependents to find.
              for tool in make bison m4 flex bc perl cmake ninja python3 glibc go cargo; do
                mkdir -p "$db/$tool" && printf "system 1\n" > "$db/$tool/version" && printf "#!/bin/sh\n:\n" > "$db/$tool/build" && chmod +x "$db/$tool/build" && touch "$db/$tool/manifest"
              done
              pm b "${{ matrix.pkg }}"
              # Only copy the target package tarball, not deps
              pkg="${{ matrix.pkg }}"
              for f in /root/.cache/kominka/bin/${pkg}@*.tar.*; do
                [ -f "$f" ] && cp "$f" /out/
              done'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.pkg }}-amd64
          path: out/*.tar.*
          if-no-files-found: error
