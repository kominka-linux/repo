name: Rebuild world (x86_64, one-shot)
# Builds all packages for x86_64 using the Debian builder.
# No kominka:core bootstrap needed — Debian is the native build environment.
# Outputs: GitHub artifacts named <pkg>-amd64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg:
          - curl
          - git
          - linux-pam
          - sudo-rs

    steps:
      - uses: actions/checkout@v4

      - name: Build Debian builder image
        run: |
          docker build \
            --build-context packages=packages \
            -t kominka-debian-builder -f Dockerfile.glibc .

      - name: Build ${{ matrix.pkg }}
        run: |
          mkdir -p out
          docker run --rm \
            -v "$PWD/packages:/packages:ro" \
            -v "$PWD/pm.ysh:/usr/bin/pm:ro" \
            -v "$PWD/out:/out" \
            -e KOMINKA_PATH=/packages \
            -e KOMINKA_ROOT=/kominka-root \
            -e KOMINKA_COMPRESS=gz \
            -e KOMINKA_COLOR=0 \
            -e KOMINKA_PROMPT=0 \
            -e KOMINKA_FORCE=1 \
            -e KOMINKA_GET=/usr/bin/curl \
            -e KOMINKA_INSECURE=1 \
            -e LOGNAME=root \
            -e HOME=/root \
            kominka-debian-builder bash -ec '
              DB=/kominka-root/var/db/kominka/installed
              for tool in make bison m4 flex bc perl cmake ninja python3 glibc; do
                mkdir -p "${DB}/${tool}"
                printf "system 1\n" > "${DB}/${tool}/version"
                printf "#!/bin/sh\n:\n" > "${DB}/${tool}/build"
                chmod +x "${DB}/${tool}/build"
                touch "${DB}/${tool}/manifest"
              done
              pm b "${{ matrix.pkg }}"
              for f in /root/.cache/kominka/bin/${{ matrix.pkg }}@*.tar.*; do
                [ -f "$f" ] && cp "$f" /out/
              done'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.pkg }}-amd64
          path: out/*.tar.*
          if-no-files-found: error
