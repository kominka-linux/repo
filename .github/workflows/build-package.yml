name: Build package

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package name
        required: true
        type: string
      debian:
        description: Use Debian GCC for arm64 too (default for amd64)
        required: false
        type: boolean
        default: false

jobs:
  build:
    name: Build ${{ inputs.package }} (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # amd64: always use Debian builder — kominka:core x86_64 packages
          # were built with Debian gcc and link libstdc++ which isn't in core.
          - { arch: amd64, runner: ubuntu-latest,    debian: true  }
          # arm64: use kominka:core (zig cc) by default; debian input overrides.
          - { arch: arm64, runner: ubuntu-24.04-arm, debian: false }
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Checkout pm
        uses: actions/checkout@v4
        with:
          repository: kominka-linux/pm
          path: pm

      # ── zig cc path (arm64 default) ─────────────────────────────────────

      - name: Cache kominka:core
        id: cache
        if: ${{ !matrix.debian && !inputs.debian }}
        uses: actions/cache@v4
        with:
          path: /tmp/kominka-core.tar.gz
          key: kominka-core-${{ matrix.arch }}-${{ hashFiles('Dockerfile', 'pm/pm.ysh', 'packages/**/PKGBUILD.ysh') }}

      - name: Build kominka:core
        if: ${{ !matrix.debian && !inputs.debian && steps.cache.outputs.cache-hit != 'true' }}
        run: |
          docker build \
            --build-context packages=packages \
            --build-context pm=pm \
            --build-arg R2_MIRROR=https://pub-15b3a4c25627476493c0e1a68993f4d8.r2.dev \
            -t kominka:core .
          docker save kominka:core | gzip > /tmp/kominka-core.tar.gz

      - name: Load kominka:core
        if: ${{ !matrix.debian && !inputs.debian && steps.cache.outputs.cache-hit == 'true' }}
        run: docker load < /tmp/kominka-core.tar.gz

      - name: Build ${{ inputs.package }} (zig cc)
        if: ${{ !matrix.debian && !inputs.debian }}
        run: |
          mkdir -p out
          docker run --rm \
            -v "$PWD/packages:/packages:ro" \
            -v "$PWD/pm/pm.ysh:/usr/bin/pm:ro" \
            -v "$PWD/out:/out" \
            -e KOMINKA_REPO="${{ secrets.KOMINKA_REPO }}" \
            -e KOMINKA_TOKEN="${{ secrets.KOMINKA_TOKEN }}" \
            -e KOMINKA_PATH=/packages \
            -e KOMINKA_COMPRESS=gz \
            -e KOMINKA_COLOR=0 \
            -e KOMINKA_PROMPT=0 \
            -e KOMINKA_FORCE=1 \
            -e KOMINKA_GET=/usr/bin/curl \
            -e KOMINKA_INSECURE=1 \
            -e LD_LIBRARY_PATH=/usr/lib \
            -e LOGNAME=root \
            -e HOME=/root \
            kominka:core sh -c '
              pm b "${{ inputs.package }}"
              ldconfig 2>/dev/null
              for f in /root/.cache/kominka/bin/${{ inputs.package }}@*.tar.*; do
                [ -f "$f" ] && cp "$f" /out/
              done
              pm p "${{ inputs.package }}" || true'

      # ── Debian builder path (amd64 always, arm64 if debian=true) ────────

      - name: Build Debian builder image
        if: ${{ matrix.debian || inputs.debian }}
        run: |
          docker build \
            --build-context packages=packages \
            --build-context pm=pm \
            -t kominka-debian-builder -f Dockerfile.glibc .

      - name: Build ${{ inputs.package }} (Debian GCC)
        if: ${{ matrix.debian || inputs.debian }}
        run: |
          mkdir -p out
          docker run --rm \
            -v "$PWD/packages:/packages:ro" \
            -v "$PWD/pm/pm.ysh:/usr/bin/pm:ro" \
            -v "$PWD/out:/out" \
            -e KOMINKA_REPO="${{ secrets.KOMINKA_REPO }}" \
            -e KOMINKA_TOKEN="${{ secrets.KOMINKA_TOKEN }}" \
            -e KOMINKA_PATH=/packages \
            -e KOMINKA_ROOT=/kominka-root \
            -e KOMINKA_COMPRESS=gz \
            -e KOMINKA_COLOR=0 \
            -e KOMINKA_PROMPT=0 \
            -e KOMINKA_FORCE=1 \
            -e KOMINKA_GET=/usr/bin/curl \
            -e KOMINKA_INSECURE=1 \
            -e LOGNAME=root \
            -e HOME=/root \
            kominka-debian-builder bash -ec '
              DB=/kominka-root/var/db/kominka/installed
              for tool in make bison m4 flex bc perl cmake ninja python3 glibc go cargo muon samurai zig; do
                mkdir -p "${DB}/${tool}"
                printf "system 1\n" > "${DB}/${tool}/version"
                printf "#!/bin/sh\n:\n" > "${DB}/${tool}/build"
                chmod +x "${DB}/${tool}/build"
                touch "${DB}/${tool}/manifest"
              done
              pm b "${{ inputs.package }}"
              for f in /root/.cache/kominka/bin/${{ inputs.package }}@*.tar.*; do
                [ -f "$f" ] && cp "$f" /out/
              done
              pm p "${{ inputs.package }}" || true'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.package }}-${{ matrix.arch }}
          path: out/*.tar.*
          if-no-files-found: warn
