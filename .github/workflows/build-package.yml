name: Build Package

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package name
        required: true
        type: string

jobs:
  build:
    name: Build ${{ inputs.package }} (${{ matrix.arch }})
    permissions:
      contents: read
      id-token: write   # required to request a GitHub OIDC token
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Get OIDC token
        run: |
          TOKEN=$(curl -fsSL \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=kominka-repo" | jq -r .value)
          echo "KOMINKA_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Cache kominka:builder
        id: cache
        uses: actions/cache@v4
        with:
          path: /tmp/kominka-builder.tar.gz
          key: kominka-builder-${{ matrix.arch }}-${{ hashFiles('Dockerfile', 'pm.ysh') }}

      - name: Build kominka:builder
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        run: |
          KARCH=$(uname -m | sed 's/x86_64/x86_64-linux-gnu/;s/aarch64/aarch64-linux-gnu/')
          docker build \
            --build-arg REPO_URL=https://kominka.17166969.xyz \
            --build-arg KARCH=$KARCH \
            -t kominka:builder .
          docker save kominka:builder | gzip > /tmp/kominka-builder.tar.gz

      - name: Load kominka:builder
        if: ${{ steps.cache.outputs.cache-hit == 'true' }}
        run: docker load < /tmp/kominka-builder.tar.gz

      - name: Build ${{ inputs.package }}
        run: |
          mkdir -p out
          docker run --rm \
            -v "$PWD/packages:/packages:ro" \
            -v "$PWD/pm.ysh:/usr/bin/pm:ro" \
            -v "$PWD/out:/out" \
            -e KOMINKA_REPO='https://kominka.17166969.xyz' \
            -e KOMINKA_TOKEN="$KOMINKA_TOKEN" \
            -e KOMINKA_PATH=/packages \
            -e KOMINKA_COMPRESS=gz \
            -e KOMINKA_COLOR=0 \
            -e KOMINKA_PROMPT=0 \
            -e KOMINKA_FORCE=1 \
            -e LD_LIBRARY_PATH=/usr/lib \
            -e LOGNAME=root \
            -e HOME=/root \
            kominka:builder /usr/local/bin/ysh -c '
              pm b "${{ inputs.package }}"
              for f in /root/.cache/kominka/bin/${{ inputs.package }}@*.tar.*; do
                test -f "$f" && cp "$f" /out/
              done
              pm p "${{ inputs.package }}"'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.package }}-${{ matrix.arch }}
          path: out/*.tar.*
          if-no-files-found: warn
