name: Build package

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # zig cc
          - { pkg: baseinit       }
          - { pkg: baselayout     }
          - { pkg: bison          }
          - { pkg: boringssl      }
          - { pkg: bzip2          }
          - { pkg: ca-certificates }
          - { pkg: cargo          }
          - { pkg: cmake          }
          - { pkg: curl           }
          - { pkg: dosfstools     }
          - { pkg: dropbear       }
          - { pkg: e2fsprogs      }
          - { pkg: go             }
          - { pkg: libevent       }
          - { pkg: libudev-zero   }
          - { pkg: linux-pam      }
          - { pkg: m4             }
          - { pkg: make           }
          - { pkg: muon           }
          - { pkg: pkgconf        }
          - { pkg: runit          }
          - { pkg: samurai        }
          - { pkg: sqlite         }
          - { pkg: sudo-rs        }
          - { pkg: tailscale      }
          - { pkg: tmux           }
          - { pkg: xz             }
          - { pkg: ysh            }
          - { pkg: zig            }
          - { pkg: zlib           }
          # Debian GCC
          - { pkg: busybox, debian: true }
          - { pkg: git,     debian: true }
          - { pkg: glibc,   debian: true }
          - { pkg: linux,   debian: true }
          - { pkg: perl,    debian: true }
          - { pkg: strace,  debian: true }

    steps:
      - uses: actions/checkout@v4

      # ── kominka:core cache ────────────────────────────────────────────────
      - name: Cache kominka:core
        id: cache
        uses: actions/cache@v4
        with:
          path: /tmp/kominka-core.tar.gz
          key: kominka-core-amd64-${{ hashFiles('Dockerfile', 'pm.ysh', 'packages/**/PKGBUILD.ysh') }}

      - name: Build kominka:core
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          docker build \
            --build-context packages=packages \
            --build-arg R2_MIRROR=https://pub-15b3a4c25627476493c0e1a68993f4d8.r2.dev \
            -t kominka:core .
          docker save kominka:core | gzip > /tmp/kominka-core.tar.gz

      - name: Load kominka:core
        if: steps.cache.outputs.cache-hit == 'true'
        run: docker load < /tmp/kominka-core.tar.gz

      # ── Build (zig cc) ────────────────────────────────────────────────────
      - name: Build ${{ matrix.pkg }}
        if: ${{ !matrix.debian }}
        run: |
          mkdir -p out
          docker run --rm \
            -v "$PWD/packages:/packages:ro" \
            -v "$PWD/pm.ysh:/usr/bin/pm:ro" \
            -v "$PWD/out:/out" \
            -e KOMINKA_PATH=/packages \
            -e KOMINKA_COMPRESS=gz \
            -e KOMINKA_COLOR=0 \
            -e KOMINKA_PROMPT=0 \
            -e KOMINKA_FORCE=1 \
            -e KOMINKA_GET=/usr/bin/curl \
            -e KOMINKA_INSECURE=1 \
            -e LD_LIBRARY_PATH=/usr/lib \
            -e LOGNAME=root \
            -e HOME=/root \
            kominka:core sh -c '
              pm b "${{ matrix.pkg }}"
              ldconfig 2>/dev/null
              for f in /root/.cache/kominka/bin/*@*.tar.*; do
                [ -f "$f" ] && cp "$f" /out/
              done'

      # ── Build (Debian GCC) ────────────────────────────────────────────────
      - name: Build Debian builder image
        if: ${{ matrix.debian }}
        run: |
          docker build \
            --build-context packages=packages \
            -t kominka-debian-builder -f Dockerfile.glibc .

      - name: Build ${{ matrix.pkg }} (Debian GCC)
        if: ${{ matrix.debian }}
        run: |
          mkdir -p out
          docker run --rm \
            -v "$PWD/packages:/packages:ro" \
            -v "$PWD/pm.ysh:/usr/bin/pm:ro" \
            -v "$PWD/out:/out" \
            -e KOMINKA_PATH=/packages \
            -e KOMINKA_ROOT=/kominka-root \
            -e KOMINKA_COMPRESS=gz \
            -e KOMINKA_COLOR=0 \
            -e KOMINKA_PROMPT=0 \
            -e KOMINKA_FORCE=1 \
            -e KOMINKA_GET=/usr/bin/curl \
            -e KOMINKA_INSECURE=1 \
            -e LOGNAME=root \
            -e HOME=/root \
            kominka-debian-builder sh -c '
              db=/kominka-root/var/db/kominka/installed
              for tool in make bison m4; do
                mkdir -p "$db/$tool"
                printf "system 1\n" > "$db/$tool/version"
                printf "#!/bin/sh\n:\n" > "$db/$tool/build"
                chmod +x "$db/$tool/build"
                touch "$db/$tool/manifest"
              done
              pm b "${{ matrix.pkg }}"
              for f in /root/.cache/kominka/bin/*@*.tar.*; do
                [ -f "$f" ] && cp "$f" /out/
              done'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.pkg }}-amd64
          path: out/*.tar.*
          if-no-files-found: error
